[project]
name = "guide-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiofiles==25.1.0",
    "aiogram==3.31.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiohttp-socks==0.12.0",
    "aiosignal==1.4.0",
    "aiosqlite==0.22.1",
    "annotated-types==0.8.0",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "dotenv==0.9.9",
    "frozenlist==1.8.0",
    "greenlet==3.5.6",
    "idna==3.20",
    "magic-filter==1.0.12",
    "multidict==7.1.0",
    "propcache==0.5.4",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "python-dotenv==1.2.4",
    "python-socks==3.1.1",
    "sqlalchemy[asyncio]==2.1.5",
    "typing-inspection==0.4.4",
    "typing-extensions==4.16.0",
    "yarl==1.25.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
